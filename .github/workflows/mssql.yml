name: mssql

# The SQL Server path (phase 5) needs Microsoft's SQL Server image, so it is not part of the PR
# checks: run it by hand or weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"

permissions:
  contents: read

concurrency:
  group: mssql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mssql-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # The repository owner accepts the SQL Server Developer EULA for this CI run, as the
      # owner's mssql-cdc-pyspark CI does for its SQL Server service.
      MSSQL_ACCEPT_EULA: "Y"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make mssql-demo
      - name: Collect compose logs
        if: failure()
        run: docker compose --profile mssql logs --no-color > compose.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: compose-log
          path: compose.log
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: make down
