# Memory limits, sized for a 16 GB laptop (long-running services: 6.0 GB in total):
#   postgres 256m | kafka 1g (heap 512m) | schema-registry 512m (heap 256m) |
#   connect 1280m (heap 512m) | s3 512m | consumer 2560m (driver 1g).
# On demand: spark-job 2560m and mutator 256m (profile tools), kafka-ui 512m (profile ui),
#   curl init containers 64m each.
# Peaks measured during `make demo` on 2026-10-25: consumer 2.1 GB, spark-job 2.0 GB (under
#   the old 2 GB limit), connect 1.03 GB, kafka 0.64 GB, schema-registry 0.34 GB,
#   s3 0.14 GB, postgres 0.07 GB, mutator 0.04 GB.
name: cdc-streaming-demo

x-app-env: &app-env
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cdc_demo_admin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-cdc_demo_secret}
  S3_REGION: ${S3_REGION:-us-east-1}
  # Inside the network the services are reached by name, whatever the host-side .env says.
  S3_ENDPOINT: http://s3:9000
  LAKE_ROOT: ${LAKE_ROOT:-s3a://cdc-demo}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  SCHEMA_REGISTRY_URL: http://schema-registry:8081
  CDC_TOPIC: ${CDC_TOPIC:-cdc.public.orders}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-cdc_demo}
  POSTGRES_USER: ${POSTGRES_USER:-cdc_owner}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdc_owner_pw}
  SPARK_MASTER: ${SPARK_MASTER:-local[2]}
  SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}

services:
  postgres:
    image: postgres:18.6-alpine
    mem_limit: 256m
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdc_demo}
      POSTGRES_USER: ${POSTGRES_USER:-cdc_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdc_owner_pw}
      CDC_DB_USER: ${CDC_DB_USER:-cdc_reader}
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-cdc_reader_pw}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG 18 keeps PGDATA under /var/lib/postgresql/<major>, so the mount is one level up.
      - pg_data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [demo]

  kafka:
    image: confluentinc/cp-kafka:8.3.2
    mem_limit: 1g
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # The tool is a second JVM inside the container; keep its heap small.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s
    networks: [demo]

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms256m -Xmx256m
    ports:
      - "127.0.0.1:${SCHEMA_REGISTRY_PORT:-8081}:8081"
    healthcheck:
      # The 8.3.2 image ships no curl or wget; it does ship python3.
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [demo]

  connect:
    # Debezium Connect plus Confluent's Protobuf converter (docker/connect.Dockerfile).
    build:
      context: docker
      dockerfile: connect.Dockerfile
    image: cdc-demo-connect:local
    mem_limit: 1280m
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: cdc-demo-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      HEAP_OPTS: -Xms512m -Xmx512m
      # Lets the connector config say ${env:CDC_DB_PASSWORD} instead of holding the password.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      POSTGRES_DB: ${POSTGRES_DB:-cdc_demo}
      CDC_DB_USER: ${CDC_DB_USER:-cdc_reader}
      CDC_DB_PASSWORD: ${CDC_DB_PASSWORD:-cdc_reader_pw}
    ports:
      - "127.0.0.1:${CONNECT_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [demo]

  connector-init:
    image: curlimages/curl:8.23.0
    mem_limit: 64m
    depends_on:
      connect:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/register-connector.sh"]
    environment:
      CONNECT_URL: http://connect:8083
      CONFIG_FILE: /config/orders-connector.json
    volumes:
      - ./scripts/register-connector.sh:/scripts/register-connector.sh:ro
      - ./debezium/orders-connector.json:/config/orders-connector.json:ro
    restart: "no"
    networks: [demo]

  s3:
    image: rustfs/rustfs:1.0.3
    mem_limit: 512m
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-cdc_demo_admin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-cdc_demo_secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:${S3_API_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3_data:/data
    healthcheck:
      # The image ships curl and answers 200 on /health (checked against 1.0.3).
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [demo]

  s3-init:
    image: curlimages/curl:8.23.0
    mem_limit: 64m
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/create-bucket.sh"]
    environment:
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cdc_demo_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cdc_demo_secret}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./scripts/create-bucket.sh:/scripts/create-bucket.sh:ro
    restart: "no"
    networks: [demo]

  consumer:
    # The only service that builds the spark image; spark-job runs the same tag.
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: spark
    image: cdc-demo-spark:local
    mem_limit: 2560m
    command: ["consume"]
    depends_on:
      kafka:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      connector-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      CONSUMER_TRIGGER_INTERVAL: ${CONSUMER_TRIGGER_INTERVAL:-10 seconds}
      CONSUMER_MAX_OFFSETS_PER_TRIGGER: ${CONSUMER_MAX_OFFSETS_PER_TRIGGER:-10000}
      CONSUMER_APP_ID: ${CONSUMER_APP_ID:-orders-cdc-consumer-v1}
    ports:
      - "127.0.0.1:${SPARK_UI_PORT:-4040}:4040"
    restart: on-failure
    networks: [demo]

  mutator:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: mutator
    image: cdc-demo-mutator:local
    mem_limit: 256m
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      MUTATOR_RATE: ${MUTATOR_RATE:-20}
      MUTATOR_INSERT_WEIGHT: ${MUTATOR_INSERT_WEIGHT:-0.5}
      MUTATOR_UPDATE_WEIGHT: ${MUTATOR_UPDATE_WEIGHT:-0.4}
      MUTATOR_DELETE_WEIGHT: ${MUTATOR_DELETE_WEIGHT:-0.1}
      MUTATOR_CANCEL_PROBABILITY: ${MUTATOR_CANCEL_PROBABILITY:-0.1}
    volumes:
      - demo_runs:/runs
    networks: [demo]

  spark-job:
    # Runs the image built by `consumer` (`make up` / `make demo` build it). Two services
    # building one tag export it twice in parallel, and the containerd image store fails that
    # build with "parent snapshot ... does not exist".
    image: cdc-demo-spark:local
    pull_policy: never
    mem_limit: 2560m
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - demo_runs:/runs
    # A short-lived command, not a server: the image's UI probe does not apply.
    healthcheck:
      disable: true
    networks: [demo]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    mem_limit: 512m
    profiles: [ui]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: cdc-demo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8090}:8080"
    networks: [demo]

networks:
  demo:
    driver: bridge

volumes:
  pg_data:
  kafka_data:
  s3_data:
  demo_runs:
